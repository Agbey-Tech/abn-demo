<circle cx="45" cy="144" r="8" fill="#074DA5" stroke="#B7C8E4" stroke-width="2"/><text x="75" y="150" fill="#fff" font-size="19" font-weight="700">Define</text><text x="75" y="172" fill="#B7C8E4" font-size="12">Agree a practical scope.</text>
<circle cx="45" cy="209" r="8" fill="#074DA5" stroke="#B7C8E4" stroke-width="2"/><text x="75" y="215" fill="#fff" font-size="19" font-weight="700">Build</text><text x="75" y="237" fill="#B7C8E4" font-size="12">Bring the right solution to life.</text>
</g></g>
<text x="100" y="930" fill="#DCE7F8" font-size="13" letter-spacing="2">EVERY GREAT PROJECT STARTS WITH A CONVERSATION.</text>
