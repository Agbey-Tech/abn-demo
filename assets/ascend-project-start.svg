<text x="36" y="51" fill="#000E3F" font-size="21" font-weight="700">ASCEND</text><text x="419" y="49" fill="#65738B" font-size="11" letter-spacing="1">THE BRIEF / 01</text>
<path d="M36 76H519" stroke="#D9DFE8"/>
<text x="36" y="118" fill="#074DA5" font-size="13" letter-spacing="2">START WITH WHAT MATTERS.</text>
<text x="33" y="183" fill="#000E3F" font-size="54" font-weight="700" letter-spacing="-2">A good idea.</text><text x="33" y="241" fill="#000E3F" font-size="54" font-weight="700" letter-spacing="-2">A clear plan.</text>
<text x="36" y="287" fill="#65738B" font-size="17">Your goals. Your people. Your next step.</text>
<path d="M36 323H519" stroke="#D9DFE8"/><text x="36" y="357" fill="#65738B" font-size="12" letter-spacing="1">WHAT ARE WE BUILDING?</text>
<rect x="36" y="376" width="140" height="42" rx="3" fill="#074DA5"/><text x="66" y="402" fill="#fff" font-size="14">Website</text>
<rect x="188" y="376" width="151" height="42" rx="3" fill="#EDF2F8"/><text x="217" y="402" fill="#000E3F" font-size="14">Platform</text>
<rect x="351" y="376" width="167" height="42" rx="3" fill="#EDF2F8"/><text x="385" y="402" fill="#000E3F" font-size="14">System</text>
<text x="36" y="483" fill="#000E3F" font-size="16" font-weight="700">Let’s find the right starting point.</text><path d="M485 487L509 463M485 463H509V487" stroke="#074DA5" stroke-width="3"/>
</g></g>
